name: Package Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'dotnet-tools'
          dotnet tool install --tool-path $toolPath vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install Velopack CLI."
          }
          $toolPath >> $env:GITHUB_PATH

      - name: Select release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:RELEASE_TAG.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Release version '$version' is not a valid semantic version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable packages
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Palworld Server Manager v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/releases/${{ steps.version.outputs.value }}/*
